# Clause segmentation. A clause is the unit for every later step.

# Contrast markers: split BEFORE them and attach the marker to the following clause.
contrast_markers: [but, however, although, though, yet, while, whereas, except]

# Split characters / patterns (regex) that always end a clause.
split_patterns:
  - '[.!?]+\s+'     # sentence boundary
  - ';'
  - ','
  - '\s+-\s+'       # spaced dash
  - ':'

# Leading connectors stripped from the start of a clause (kept as clause.marker if a contrast marker).
connectors: [and, or, also, plus]

# "None" detector. All patterns are regexes matched (case-insensitive) against a WHOLE clause
# after lower-casing, contraction expansion and stripping of punctuation and filler words.

# Filler words/phrases removed from the start and end of a clause before matching.
fillers: [honestly, well, to be honest, frankly, personally, actually, i think, i guess, so, ok, okay, oh, um, uh, for me, for now, at all, at the moment, so far]

# Clause is "nothing to say" -> pure NONE.
none_patterns:
  - '(?:i )?(?:can not|cannot) complain|kuch (?:nahi|nahin)|koi (?:masla|masla nahi|baat nahi)'
  - 'no complaints so far|nothing so far|none so far'
  - '(?:i have )?(?:absolutely |literally )?(?:nothing|none|nil|nada)'
  - 'nope|nah|no'
  - 'rien|nada|nichts|niente|nulla|ninguno|ninguna'
  - 'nothing (?:that )?comes to mind|nothing (?:that )?(?:i can|comes) (?:think of|to mind)'
  - '(?:i )?(?:have )?(?:absolutely |literally )?no (?:complaints?|issues?|problems?)(?: at all)?'
  - 'not really|not particularly|not much'
  - '(?:i have )?nothing (?:to (?:say|complain about|dislike|criticise|criticize|mention|add|report)|displeases? me|displeased me|bothers? me|bothered me|negative|in particular|else|really)'
  - 'nothing (?:at all|whatsoever)'
  - '(?:particularly |really )?nothing (?:bad|negative|wrong|worth \w+)(?: .*)?'
  - 'nothing (?:personally |really |particularly )?(?:displeased?|disappointed?|bothered?|annoyed?|disturbed?|upset|disliked?)s?(?: me)?(?: .*)?'
  - '(?:there (?:was|is) )?nothing (?:that )?(?:i )?(?:dislike|disliked|hate|hated|mind|minded|regret)'
  - '(?:there (?:was|is|were) )?(?:i (?:have|had) )?nothing (?:in particular |specific |much |really )?(?:to |that (?:i )?)(?:complain|criticis\w+|criticiz\w+|dislike\w*|object|fault|reproach|mention|add|report|improve|change)(?: .*)?'
  - 'there (?:was|is|were) not (?:a single|any) \w+(?: of .*)? that (?:i )?(?:dislike|disliked|mind|minded)(?: .*)?'
  - '(?:i )?(?:did not|do not|could not|can not) (?:find|identify|see|think of|notice|come up with) (?:any|anything|a single)\b.*\b(?:disappointing|disliked|dislike|bad|wrong|negative|complain\w*|faults?|issues?|problems?|bother\w*|annoy\w*|displeas\w*)\b.*'
  - '(?:without|with no) (?:any |a single )?(?:noticeable |real |major |particular )?(?:drawbacks?|downsides?|complaints?|issues?|problems?|faults?)(?: .*)?'
  - '(?:i )?(?:found|find) no (?:particular |real )?(?:faults?|flaws?|drawbacks?)(?: .*)?'
  - 'nothing (?:really |particularly )?(?:stood out|caught my (?:attention|eye))(?: .*)?'
  - 'no (?:negative|particular|real|major|noticeable|bad|specific)? ?(?:features?|aspects?|points?|things?|elements?)(?: .*)?'
  - '(?:with |and )?no (?:particular |real |major |noticeable )?(?:drawbacks?|downsides?)(?: .*)?'
  - '(?:i )?(?:have )?no (?:complaints?|issues?|problems?|dislikes?|criticisms?|comments?|remarks?)(?: (?:at all|whatsoever|about .*|with .*))?'
  - '(?:i )?can not think of (?:anything|something)(?: .*)?'
  - '(?:i )?(?:do not|did not) (?:dislike|mind) (?:anything|it)'
  - '(?:i )?(?:have )?nothing against (?:it|this|that|them|the .*|this .*)?'
  - 'no (?:noticeable |real |major |particular )?(?:drawbacks?|downsides?|cons?)'
  - 'everything(?: is| was)? (?:fine|good|great|perfect|ok|okay)'
  - '(?:i )?(?:like|love|liked|loved|enjoy|enjoyed) everything(?: about .*)?'
  - 'it is (?:all )?(?:fine|good|great|perfect)'
  - 'all (?:good|fine|great)'

# Clause means "no usable data" (unusable answer), not a real "none".
nodata_patterns:
  - '(?:i )?(?:have not|did not|do not) (?:tried|try) (?:it|this|them)?(?: yet)?|not tried(?: it)?(?: yet)?|no comment|no comments|no opinion'
  - 'n/?a'
  - '[asdfghjkl]{4,}|qwerty\w*|xxx+|test|lorem ipsum|\?+|\.+|-+'
  - 'na'
  - 'not applicable'
  - 'no idea'
  - 'idk'
  - 'dont know|do not know'
  - '-+|\.+|\?+|x+'

# "Nothing wrong with X": a scoped statement about one thing, not a blanket "no complaints". Treated as ordinary praise.
scoped_none_patterns:
  - '(?:there (?:was|is) )?nothing (?:bad|wrong|negative) (?:with|about|in) (?:the|its|this|my|their|our) .+'

# Phrases that LOOK like a none but are hedges ("Nothing is perfect") -> HEDGED_NONE, low confidence.
hedge_none_patterns:
  - 'nothing is perfect'
  - 'nobody is perfect'
  - 'nothing (?:is )?(?:ever )?(?:perfect|flawless)'

# Words signalling a complaint / suggestion inside a clause that follows a none-phrase.
complaint_cues: [better, maybe, perhaps, need, needs, needed, should, could, would, wish, lack, lacks, lacking, missing, miss, improve, improved, improvement, more, less, too, bit, little, slightly, except, but, however, although, though, instead, rather, unfortunately, sadly, wrong, bad, worse, worst, hate, annoying, annoyed, disappointing, disappointed, disappoints, expensive, price, small, hard, soft, stick, sticks, sticky]

# Words signalling praise inside a clause.
praise_cues: [close, best, pleasure, enjoyable, good, great, nice, love, loved, like, liked, enjoy, enjoyed, delicious, tasty, perfect, excellent, amazing, wonderful, fantastic, awesome, happy, satisfied, satisfying, pleasant, appealed, recommend, favourite, favorite, best, yummy, crunchy, crispy, creamy, smooth, well]


